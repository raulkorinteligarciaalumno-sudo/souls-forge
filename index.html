<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOULS FORGE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#170d0b;color:#f4dfb0;font-family:Georgia,serif}
#game{max-width:1000px;margin:auto;padding:10px;border:2px solid #a86c2d;border-radius:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(22px,4vw,32px);letter-spacing:3px;margin:0}small{color:#e7a04e}
#healthbar{width:170px;height:12px;border:1px solid #e8c69a;background:#300b08}#healthfill{height:100%;width:100%;background:#d92b21}
canvas{width:100%;display:block;margin-top:8px;border:1px solid #9c5522;border-radius:5px;background:#f47719;touch-action:none}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{flex:1;min-width:110px;background:#251710;color:#f4dfb0;border:1px solid #987044;padding:11px;cursor:pointer;font: bold 14px Georgia,serif}
button:hover{filter:brightness(1.25)}button.active{background:#122a36;color:#8ceaff;border-color:#65caff}
#msg{padding:9px;color:#e8a65c;text-align:center}
</style>
</head>
<body>
<div id="game">
<header>
 <div><h1>SOULS FORGE</h1><small>EL AUTÓMATA DE LAS BRASAS</small></div>
 <div>VIDA <b id="hp">100 / 100</b><div id="healthbar"><div id="healthfill"></div></div></div>
 <div>OLEADA <b id="wave">1</b> · ALMAS <b id="souls">0</b></div>
</header>
<canvas id="arena" width="800" height="460"></canvas>
<div class="controls">
 <button id="plasma" class="active">⚡ PLASMA</button><button id="shot">▰ ESCOPETA</button>
 <button id="repair">✚ REPARAR · 20 almas</button><button id="pause">Ⅱ PAUSAR</button><button id="restart">↻ REINICIAR</button>
</div>
<div id="msg">WASD o flechas · Ratón para apuntar y disparar · Espacio para disparar. Cada quinta oleada aparece un jefe.</div>
</div>
<script>
(()=>{
const c=document.getElementById('arena'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
let keys={},mouse={x:500,y:230,down:false},p,enemies,shots,foeShots,particles,wave,souls,weapon,paused,dead,last=0,spawnClock=0;
function reset(){p={x:400,y:235,hp:100,angle:0,inv:0};enemies=[];shots=[];foeShots=[];particles=[];wave=1;souls=0;weapon='plasma';paused=false;dead=false;spawnClock=0;for(let i=0;i<5;i++)spawn();$('msg').textContent='Tu autómata ha sido reforzado. ¡Sobrevive a las oleadas!';updateHud();draw()}
function spawn(){let boss=wave%5===0&&enemies.filter(e=>e.boss).length===0&&enemies.length===0;enemies.push({x:boss?690:Math.random()*700+50,y:boss?210:Math.random()*360+50,hp:boss?190:28,max:boss?190:28,r:boss?36:15,boss,spd:boss?34:42+wave*2,cd:1+Math.random()})}
function updateHud(){$('hp').textContent=Math.ceil(p.hp)+' / 100';$('healthfill').style.width=Math.max(0,p.hp)+'%';$('healthfill').style.background=p.hp<25?'#ff2617':p.hp<50?'#ff9c24':'#d92b21';$('wave').textContent=wave;$('souls').textContent=souls}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*100+20;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.3+Math.random()*.6,color})}}
function shoot(){if(dead||paused)return;let a=Math.atan2(mouse.y-p.y,mouse.x-p.x);for(let i=0;i<(weapon==='shot'?5:1);i++){let ang=a+(Math.random()-.5)*(weapon==='shot'?.34:.035),speed=weapon==='shot'?390:570;shots.push({x:p.x+Math.cos(a)*22,y:p.y+Math.sin(a)*22,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,life:.8,dmg:weapon==='shot'?12:18,color:weapon==='shot'?'#ffd08a':'#66eaff'})}}
function robot(x,y,a,scale=1){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(scale,scale);let metal=ctx.createLinearGradient(-18,-18,22,22);metal.addColorStop(0,'#c4d6da');metal.addColorStop(.28,'#536c7a');metal.addColorStop(.62,'#1a2938');metal.addColorStop(1,'#080e18');ctx.shadowColor='#43dfff';ctx.shadowBlur=12;
for(let yy of [-12,12]){ctx.fillStyle='#111c28';ctx.fillRect(-20,yy-6,17,12);ctx.fillStyle='#27cfff';ctx.fillRect(-24,yy-3,7,6);ctx.fillStyle='#a5f8ff';ctx.fillRect(-29,yy-2,5,4)}
for(let yy of [-11,11]){ctx.fillStyle='#172531';ctx.strokeStyle='#9ab8c6';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-10,yy+7,19,16,4);ctx.fill();ctx.stroke();ctx.fillStyle='#d07832';ctx.fillRect(-7,yy+17,13,3)}
ctx.fillStyle=metal;ctx.strokeStyle='#a5c9d5';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(0,-18,25,12,4);ctx.fill();ctx.stroke();ctx.fillStyle='#182633';ctx.beginPath();ctx.roundRect(10,-15,28,8,3);ctx.fill();ctx.fillStyle='#3fe8ff';ctx.fillRect(31,-13,8,4);ctx.fillStyle='#e5ffff';ctx.fillRect(37,-12,4,2);
ctx.fillStyle=metal;ctx.beginPath();ctx.moveTo(-17,-14);ctx.lineTo(-7,-22);ctx.lineTo(11,-20);ctx.lineTo(20,-10);ctx.lineTo(17,13);ctx.lineTo(5,21);ctx.lineTo(-14,15);ctx.lineTo(-21,3);ctx.closePath();ctx.fill();ctx.strokeStyle='#b2d2d9';ctx.stroke();
ctx.fillStyle='#243c4a';ctx.beginPath();ctx.moveTo(-14,-11);ctx.lineTo(-4,-17);ctx.lineTo(4,-13);ctx.lineTo(2,-2);ctx.lineTo(-13,-1);ctx.closePath();ctx.fill();ctx.strokeStyle='#e4a04d';ctx.stroke();ctx.fillStyle='#d54a23';ctx.beginPath();ctx.moveTo(6,-16);ctx.lineTo(15,-8);ctx.lineTo(11,-2);ctx.lineTo(4,-7);ctx.closePath();ctx.fill();
ctx.shadowColor='#39e9ff';ctx.shadowBlur=18;ctx.fillStyle='#07121e';ctx.beginPath();ctx.arc(1,5,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#27dfff';ctx.beginPath();ctx.arc(1,5,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#efffff';ctx.beginPath();ctx.arc(1,5,2,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=5;ctx.fillStyle=metal;ctx.beginPath();ctx.moveTo(-13,-24);ctx.lineTo(-6,-34);ctx.lineTo(8,-34);ctx.lineTo(16,-25);ctx.lineTo(11,-16);ctx.lineTo(-9,-16);ctx.closePath();ctx.fill();ctx.strokeStyle='#c6e2e8';ctx.stroke();ctx.fillStyle='#06131f';ctx.fillRect(-9,-28,19,7);ctx.fillStyle='#5cecff';ctx.fillRect(-7,-26,5,3);ctx.fillRect(2,-26,5,3);ctx.fillStyle='#f4a447';ctx.fillRect(-4,-37,8,3);ctx.restore()}
function update(dt){if(paused||dead)return;p.inv=Math.max(0,p.inv-dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;p.x+=dx/l*230*dt;p.y+=dy/l*230*dt;p.x=Math.max(28,Math.min(772,p.x));p.y=Math.max(35,Math.min(425,p.y));p.angle=Math.atan2(mouse.y-p.y,mouse.x-p.x);
if(mouse.down||keys[' ']){spawnClock-=dt;if(spawnClock<=0){shoot();spawnClock=weapon==='shot'?.48:.19}}else spawnClock=0;
for(let e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;e.cd-=dt;if(e.cd<=0&&d>85){let a=Math.atan2(dy,dx);foeShots.push({x:e.x,y:e.y,vx:Math.cos(a)*(e.boss?220:150),vy:Math.sin(a)*(e.boss?220:150),life:2});e.cd=e.boss?.8:1.8+Math.random()}}
for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let e of enemies)if(e.hp>0&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+5){e.hp-=s.dmg;s.life=0;burst(s.x,s.y,s.color,3);break}}
shots=shots.filter(s=>s.life>0&&s.x>0&&s.x<800&&s.y>0&&s.y<460);
for(let s of foeShots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(Math.hypot(s.x-p.x,s.y-p.y)<19&&p.inv<=0){p.hp-=8;p.inv=.4;s.life=0;burst(p.x,p.y,'#ff6b36',10);if(p.hp<=0){p.hp=0;dead=true;$('msg').textContent='EL AUTÓMATA HA CAÍDO · Pulsa REINICIAR'}}}
foeShots=foeShots.filter(s=>s.life>0&&s.x>0&&s.x<800&&s.y>0&&s.y<460);let before=enemies.length;
for(let e of enemies)if(e.hp<=0){souls+=e.boss?50:5;burst(e.x,e.y,e.boss?'#ff642d':'#f7a444',e.boss?32:12)}enemies=enemies.filter(e=>e.hp>0);
if(enemies.length===0&&before===0){wave++;let count=Math.min(4+wave,12);if(wave%5===0)enemies.push({x:690,y:210,hp:190,max:190,r:36,boss:true,spd:34,cd:1});for(let i=0;i<count;i++)spawn();$('msg').textContent=wave%5===0?'¡JEFE! ¡Destruye al Guardián de Hierro!':'Oleada '+wave+' · ¡Sigue luchando!'}
for(let q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}particles=particles.filter(q=>q.t>0);updateHud()}
function draw(){ctx.clearRect(0,0,800,460);let g=ctx.createLinearGradient(0,0,800,460);g.addColorStop(0,'#ff9a2f');g.addColorStop(.55,'#ed5c13');g.addColorStop(1,'#8f2b12');ctx.fillStyle=g;ctx.fillRect(0,0,800,460);ctx.strokeStyle='rgba(255,210,105,.19)';for(let x=-460;x<900;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+220,460);ctx.stroke()}for(let y=20;y<460;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}
for(let i=0;i<32;i++){let x=(i*137+43)%800,y=(i*71+28)%460;ctx.fillStyle='rgba(65,30,17,.38)';ctx.fillRect(x,y,7+(i%4)*3,4+(i%3)*3)}
for(let i=0;i<7;i++){let x=(i*127+25)%790,y=(i*89+50)%430;ctx.fillStyle='#71331b';ctx.fillRect(x,y,14,24);ctx.fillStyle='#a54c20';ctx.fillRect(x-4,y-4,22,6)}
ctx.strokeStyle='rgba(255,220,139,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(400,230,58,0,7);ctx.arc(400,230,43,0,7);ctx.stroke();
for(let s of shots){ctx.shadowColor=s.color;ctx.shadowBlur=15;ctx.strokeStyle=s.color;ctx.lineWidth=weapon==='shot'?3:4;ctx.beginPath();ctx.moveTo(s.x-s.vx*.025,s.y-s.vy*.025);ctx.lineTo(s.x,s.y);ctx.stroke()}ctx.shadowBlur=0;
for(let s of foeShots){ctx.fillStyle='#ff421c';ctx.shadowColor='#ff310c';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill()}ctx.shadowBlur=0;
for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);let r=e.r;ctx.shadowColor=e.boss?'#ff1900':'#e83a18';ctx.shadowBlur=12;ctx.fillStyle=e.boss?'#22212a':'#34303a';ctx.strokeStyle=e.boss?'#c56b37':'#c47b42';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();for(let k=0;k<6;k++){let a=k*Math.PI/3;ctx.fillStyle='#171923';ctx.fillRect(Math.cos(a)*(r-3)-4,Math.sin(a)*(r-3)-4,8,8)}ctx.fillStyle='#ff2c16';ctx.beginPath();ctx.arc(0,0,e.boss?12:6,0,7);ctx.fill();ctx.fillStyle='#fff0b2';ctx.beginPath();ctx.arc(-2,-2,e.boss?4:2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#33130e';ctx.fillRect(-r,-r-13,r*2,5);ctx.fillStyle='#ff3c22';ctx.fillRect(-r,-r-13,r*2*Math.max(0,e.hp/e.max),5);if(e.boss){ctx.fillStyle='#b84420';ctx.fillRect(-r-9,-8,10,16);ctx.fillRect(r-1,-8,10,16)}ctx.restore()}
for(let q of particles){ctx.globalAlpha=Math.max(0,q.t);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,3,3)}ctx.globalAlpha=1;if(p){if(p.inv<=0||Math.floor(performance.now()/80)%2===0)robot(p.x,p.y,p.angle,1.05);ctx.fillStyle='#1a0e0a';ctx.fillRect(12,12,180,30);ctx.strokeStyle='#e9b66a';ctx.strokeRect(12,12,180,30);ctx.fillStyle='#ffe5b0';ctx.font='bold 14px Georgia';ctx.fillText('AUTÓMATA · MK-II',21,31)}if(paused||dead){ctx.fillStyle='rgba(20,8,5,.66)';ctx.fillRect(0,0,800,460);ctx.fillStyle='#ffe0a0';ctx.textAlign='center';ctx.font='bold 38px Georgia';ctx.fillText(dead?'AUTÓMATA DESTRUIDO':'PAUSA',400,220);ctx.font='18px Georgia';ctx.fillText(dead?'Pulsa REINICIAR para volver':'Pulsa PAUSAR para continuar',400,253);ctx.textAlign='left'}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function coords(e){let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*800/r.width;mouse.y=(e.clientY-r.top)*460/r.height}
c.addEventListener('pointermove',coords);c.addEventListener('pointerdown',e=>{coords(e);mouse.down=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',()=>mouse.down=false);c.addEventListener('pointercancel',()=>mouse.down=false);
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
$('plasma').onclick=()=>{weapon='plasma';$('plasma').classList.add('active');$('shot').classList.remove('active')};$('shot').onclick=()=>{weapon='shot';$('shot').classList.add('active');$('plasma').classList.remove('active')};
$('repair').onclick=()=>{if(souls>=20&&p.hp<100&&!dead){souls-=20;p.hp=Math.min(100,p.hp+45);updateHud();burst(p.x,p.y,'#55eaff',20)}else $('msg').textContent=souls<20?'Necesitas 20 almas para reparar':'Tu robot ya está al máximo'};
$('pause').onclick=()=>{if(!dead)paused=!paused};$('restart').onclick=reset;reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
